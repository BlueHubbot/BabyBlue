# /etc/nginx/conf.d/blueapi-help-override.conf
# BlueAPI inline boot injection — requires uncompressed HTML
#
# ⚠️ Include ONLY inside proxy locations that return Desk HTML (e.g. @webserver).

# Ensure upstream returns plain HTML for sub_filter
proxy_set_header Accept-Encoding "";

# Process only HTML payloads
sub_filter_once off;

# Inject boot script just before </head>
sub_filter </head> '<script src="/blueapi_boot.js?v=$request_id"></script></head>';
