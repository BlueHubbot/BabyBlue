#/srv/bluedoc/app/mkdocs.yml
site_name: اسناد BlueAPi — BlueDoc
site_url: https://docs.bluehesab.ir/blueapi/
docs_dir: docs
site_dir: /srv/bluedoc/main/blueapi
theme:
  name: material
  language: fa
  direction: rtl
  features:
  - content.code.copy
  - navigation.indexes
  - navigation.sections
  - navigation.tabs
  - search.highlight
  - search.suggest
  palette:
  - scheme: default
    primary: indigo
    accent: cyan
    toggle:
      icon: material/weather-night
      name: حالت تیره
  - scheme: slate
    primary: indigo
    accent: cyan
    toggle:
      icon: material/weather-sunny
      name: حالت روشن
  custom_dir: /srv/bluedoc/app/overrides
extra_css:
  - /_blue/rtl.css?v=3
  # - /_blue/rtl.css?v=2  # حذف دوتایی‌ها
extra_javascript:
  - /_blue/rtl.js?v=3
  # - /_blue/rtl.js?v=2
  # - /_blue/rtl.js?v=5
  # - /_blue/sidebar-multi.js?v=1   # موقتاً خاموش
